<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | NEDR</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 78px);
            background: #f7f9fa;
            padding: 55px 0;
        }

        .auth-wrapper {
            max-width: 620px;
            margin: 0 auto;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-heading h1 {
            font-size: 32px;
            color: #25313b;
            margin-bottom: 8px;
        }

        .auth-heading p {
            color: #6b7780;
            font-size: 14px;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid #e5e9ec;
            border-radius: 5px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .form-section {
            margin-bottom: 28px;
        }

        .form-section h2 {
            font-size: 17px;
            color: #075985;
            border-bottom: 1px solid #e5e9ec;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #39454e;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            border: 1px solid #d7dee3;
            border-radius: 4px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #075985;
        }

        .password-note {
            font-size: 11px;
            color: #7b878e;
            margin-top: 6px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 20px 0;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms label {
            font-size: 12px;
            color: #68757d;
            line-height: 1.5;
        }

        .terms a {
            color: #075985;
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 4px;
            background: #075985;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #064e73;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #6b7780;
        }

        .auth-footer a {
            color: #075985;
            font-weight: 600;
        }

        .required {
            color: #c0392b;
        }

        @media (max-width: 600px) {
            .auth-page {
                padding: 35px 0;
            }

            .auth-card {
                padding: 23px 18px;
            }

            .auth-heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a href="index.html" class="brand">
            <div class="brand-mark">N</div>

            <div class="brand-text">
                <strong>NEDR</strong>
                <span>National Education Repository</span>
            </div>
        </a>

        <div class="header-actions">
            <a href="login.html" class="login-link">Already registered?</a>
            <a href="login.html" class="register-btn">Login</a>
        </div>

    </div>
</header>


<main class="auth-page">

    <div class="container">

        <div class="auth-wrapper">

            <div class="auth-heading">

                <span class="eyebrow">
                    STUDENT SELF-REGISTRATION
                </span>

                <h1>Create Your Account</h1>

                <p>
                    Register yourself to access the NEDR student portal.
                </p>

            </div>


            <div class="auth-card">

                <form id="registrationForm">

                    <!-- ACCOUNT INFORMATION -->

                    <div class="form-section">

                        <h2>Account Information</h2>

                        <div class="form-group">

                            <label for="email">
                                Email Address <span class="required">*</span>
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your active email address"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password <span class="required">*</span>
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                minlength="8"
                                required
                            >

                            <p class="password-note">
                                Password must contain at least 8 characters.
                            </p>

                        </div>


                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm Password <span class="required">*</span>
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                minlength="8"
                                required
                            >

                        </div>

                    </div>


                    <!-- STUDENT IDENTIFICATION -->

                    <div class="form-section">

                        <h2>Student Identification</h2>

                        <div class="form-group">

                            <label for="registrationNumber">
                                Matriculation / Registration Number
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="registrationNumber"
                                name="registrationNumber"
                                placeholder="Enter your registration number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="institution">
                                Institution <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="institution"
                                name="institution"
                                placeholder="Enter your institution"
                                required
                            >

                        </div>

                    </div>


                    <!-- TERMS -->

                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label for="terms">
                            I confirm that the information provided is accurate
                            and I agree to the
                            <a href="#">Terms & Conditions</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Create Student Account
                    </button>

                </form>

            </div>


            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Sign in here
                </a>

            </div>

        </div>

    </div>

</main>


<script>

document
    .getElementById("registrationForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }

        alert(
            "Registration interface is ready. Supabase authentication will be connected next."
        );

    });

</script>

</body>
  </html>
